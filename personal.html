<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal · Limitless AV</title>
<meta name="theme-color" content="#b5603a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe4;--card:#fbf8f1;
  --ink:#2a2520;--ink-soft:#5a5247;--ink-muted:#8a7d70;
  --line:#ddd3bf;
  --clay:#b5603a;--clay-pale:rgba(181,96,58,.10);
  --c-accent:#b5603a;
  --c-horario:#b5603a;--c-finanzas:#3f7368;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Hanken Grotesk',system-ui,sans-serif;
  --radius-md:12px;--radius-lg:14px;--radius-pill:999px;
  --shadow-sm:0 2px 8px -2px rgba(42,37,32,.08);
  --shadow-md:0 6px 20px -6px rgba(42,37,32,.14);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --t-fast:.15s;--t-med:.25s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(circle at 20% -10%,#faf6ec 0%,transparent 50%);
  background-attachment:fixed;
}
.wrap{max-width:540px;margin:0 auto;padding:0 1.25rem}
header{padding:2rem 0 1.6rem}
.back-link{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.78rem;font-weight:600;color:var(--ink-muted);
  text-decoration:none;letter-spacing:.04em;margin-bottom:1.2rem;
  transition:color var(--t-fast);
}
.back-link:hover{color:var(--c-accent)}
.back-link svg{width:14px;height:14px}
.kicker{
  font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--c-accent);font-weight:700;
}
h1{
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(1.8rem,7vw,2.4rem);
  line-height:1;letter-spacing:-.02em;margin-top:.5rem;
}
h1 em{font-style:italic;color:var(--c-accent)}
.header-sub{font-size:.82rem;color:var(--ink-soft);margin-top:.6rem}
.section-label{
  font-size:.65rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-muted);
  margin:0 0 .8rem;display:flex;align-items:center;gap:.7rem;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--line)}
.apps{display:flex;flex-direction:column;gap:.75rem;margin-bottom:2rem}
.app-card{
  display:flex;align-items:center;gap:1rem;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:1.1rem 1.25rem;
  text-decoration:none;color:inherit;box-shadow:var(--shadow-sm);
  transition:box-shadow var(--t-med) var(--ease-out),border-color var(--t-fast),transform var(--t-med) var(--ease-out);
  position:relative;overflow:hidden;
}
.app-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:var(--app-color,var(--c-accent));
  border-radius:var(--radius-lg) 0 0 var(--radius-lg);
}
.app-card:hover{box-shadow:var(--shadow-md);border-color:var(--app-color,var(--c-accent));transform:translateY(-2px)}
.app-card:active{transform:translateY(0);box-shadow:var(--shadow-sm)}
.app-icon{
  width:48px;height:48px;border-radius:var(--radius-md);
  background:var(--app-bg,var(--clay-pale));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.app-icon svg{width:24px;height:24px}
.app-info{flex:1;min-width:0}
.app-name{font-family:var(--font-display);font-weight:600;font-size:1.05rem;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.app-name em{font-style:italic;color:var(--app-color,var(--c-accent))}
.app-desc{font-size:.78rem;color:var(--ink-soft);margin-top:.2rem;line-height:1.4}
.app-badge{
  font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:.2rem .55rem;border-radius:var(--radius-pill);flex-shrink:0;
}
.app-badge.live{background:rgba(78,154,82,.12);color:#3a7a3e}
.app-arrow{color:var(--line);transition:color var(--t-fast),transform var(--t-fast);flex-shrink:0}
.app-card:hover .app-arrow{color:var(--app-color,var(--c-accent));transform:translateX(3px)}
footer{text-align:center;font-family:var(--font-display);font-style:italic;color:var(--ink-muted);font-size:.85rem;padding:1.5rem 0 2.5rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Limitless Systems
    </a>
    <div class="kicker">Categoría · Personal</div>
    <h1><em>Personal</em></h1>
    <p class="header-sub">Tiempo, dinero y control de vida.</p>
  </header>

  <p class="section-label">Herramientas</p>

  <div class="apps">

    <!-- Mi Horario -->
    <a class="app-card" href="mi-horario.html"
       style="--app-color:var(--c-horario);--app-bg:rgba(181,96,58,.10)">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-horario)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
          <circle cx="12" cy="16" r="1.5" fill="var(--c-horario)" stroke="none"/>
          <path d="M12 13.5v1.5"/>
        </svg>
      </div>
      <div class="app-info">
        <div class="app-name">Mi <em>Horario</em></div>
        <div class="app-desc">Semana, año, vida en semanas y estadísticas por categoría</div>
      </div>
      <span class="app-badge live">En vivo</span>
      <svg class="app-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </a>

    <!-- CtrlFin -->
    <a class="app-card" href="finanzas.html"
       style="--app-color:var(--c-finanzas);--app-bg:rgba(63,115,104,.10)">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--c-finanzas)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <div class="app-info">
        <div class="app-name" style="--app-color:var(--c-finanzas)">Ctrl<em>Fin</em></div>
        <div class="app-desc">Transacciones, KPIs, metas de ahorro y proyecciones</div>
      </div>
      <span class="app-badge live">En vivo</span>
      <svg class="app-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </a>

  </div>

  <footer>Tiempo y dinero — lo más valioso.</footer>
</div>
</body>
</html>
