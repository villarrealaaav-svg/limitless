<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperación de Libros · AV</title>
<meta name="theme-color" content="#7a5c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#f4efe4;--card:#fbf8f1;
  --ink:#2a2520;--ink-soft:#5a5247;--ink-muted:#8a7d70;
  --line:#ddd3bf;--line-soft:#ede7d9;
  --clay:#b5603a;--clay-pale:rgba(181,96,58,.10);--clay-dark:#8f4a2a;
  --c-accent:#7a5c3a;--c-accent-pale:rgba(122,92,58,.10);
  --c-bueno:#3a7a3e;--c-danado:#c2872f;--c-muy:#b5603a;--c-destruido:#9a3324;
  --c-limpio:#3f7368;
  --tara-black:#262320;--tara-black2:#34302b;--tara-yellow:#e8b624;--tara-yellow-d:#c89614;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Hanken Grotesk',system-ui,sans-serif;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
  --shadow-sm:0 2px 8px -2px rgba(42,37,32,.08);
  --shadow-md:0 6px 20px -6px rgba(42,37,32,.16);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --t-fast:.14s;--t-med:.24s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(circle at 20% -10%,#faf6ec 0%,transparent 50%);
  background-attachment:fixed;
}

/* ── Header ──────────────────────────────────────────────────────── */
.wrap{max-width:600px;margin:0 auto;padding:0 1.15rem}
header{padding:1.7rem 0 1rem}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back-link{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.75rem;font-weight:600;color:var(--ink-muted);
  text-decoration:none;letter-spacing:.05em;margin-bottom:1rem;
  transition:color var(--t-fast);
}
.back-link:hover{color:var(--c-accent)}
.back-link svg{width:13px;height:13px}
.sync-row{display:flex;align-items:center;gap:.35rem;font-size:.66rem;color:var(--ink-muted);font-weight:600}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;transition:background .6s}
.sync-dot.on{background:var(--c-bueno)}
.kicker{font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:var(--c-accent);font-weight:700}
h1{
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.05;letter-spacing:-.02em;margin-top:.4rem;
}
h1 em{font-style:italic;color:var(--c-accent)}

/* ── Meta bar ────────────────────────────────────────────────────── */
.meta-bar{
  display:flex;gap:.55rem;flex-wrap:wrap;margin:.9rem 0 0;
}
.meta-field{
  flex:1;min-width:120px;display:flex;flex-direction:column;gap:.2rem;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:.4rem .6rem;
}
.meta-field label{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.meta-field input{border:none;background:none;font-family:var(--font-ui);font-size:.82rem;color:var(--ink);outline:none;width:100%}

/* ── Stats ───────────────────────────────────────────────────────── */
.stats-row{display:flex;gap:.45rem;flex-wrap:wrap;margin:1rem 0 1.1rem}
.stat-pill{
  display:flex;align-items:center;gap:.4rem;
  padding:.3rem .65rem;border-radius:var(--radius-pill);
  font-size:.7rem;font-weight:600;background:var(--card);
  border:1px solid var(--line);color:var(--ink-soft);
}
.stat-pill svg{width:13px;height:13px;flex-shrink:0}
.stat-pill .num{font-family:var(--font-display);font-size:1rem;font-weight:600;line-height:1}
.stat-pill.bueno .num{color:var(--c-bueno)}.stat-pill.bueno svg{color:var(--c-bueno)}
.stat-pill.danado .num{color:var(--c-danado)}.stat-pill.danado svg{color:var(--c-danado)}
.stat-pill.destruido .num{color:var(--c-destruido)}.stat-pill.destruido svg{color:var(--c-destruido)}
.stat-pill.taras .num{color:var(--c-accent)}.stat-pill.taras svg{color:var(--c-accent)}

/* ── Tabs ────────────────────────────────────────────────────────── */
.tab-bar{display:flex;border-bottom:2px solid var(--line);margin-bottom:1.1rem}
.tab-btn{
  padding:.55rem 1.1rem;font-size:.82rem;font-weight:600;
  color:var(--ink-muted);background:none;border:none;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color var(--t-fast),border-color var(--t-fast);
  display:flex;align-items:center;gap:.4rem;
}
.tab-btn svg{width:15px;height:15px}
.tab-btn.active{color:var(--c-accent);border-bottom-color:var(--c-accent)}

/* ── Toolbar ─────────────────────────────────────────────────────── */
.toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:.85rem;flex-wrap:wrap}
.search-wrap{
  flex:1;min-width:150px;display:flex;align-items:center;gap:.5rem;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:.42rem .75rem;
}
.search-wrap svg{width:14px;height:14px;color:var(--ink-muted);flex-shrink:0}
.search-wrap input{flex:1;border:none;background:none;font-family:var(--font-ui);font-size:.85rem;color:var(--ink);outline:none}
.search-wrap input::placeholder{color:var(--ink-muted)}
.add-btn{
  display:flex;align-items:center;gap:.4rem;padding:.46rem 1rem;border-radius:var(--radius-md);
  background:var(--c-accent);color:#fff;border:none;cursor:pointer;
  font-family:var(--font-ui);font-size:.82rem;font-weight:600;
  transition:background var(--t-fast);white-space:nowrap;flex-shrink:0;
}
.add-btn:hover{background:var(--clay-dark)}
.add-btn svg{width:14px;height:14px}

/* ── Filter chips ────────────────────────────────────────────────── */
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{
  display:flex;align-items:center;gap:.3rem;
  padding:.24rem .65rem;border-radius:var(--radius-pill);
  font-size:.7rem;font-weight:600;cursor:pointer;
  border:1px solid var(--line);color:var(--ink-muted);background:var(--card);
  transition:all var(--t-fast);
}
.chip svg{width:12px;height:12px}
.chip:hover{border-color:var(--c-accent);color:var(--c-accent)}
.chip.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}

/* ── Book cards ──────────────────────────────────────────────────── */
.book-list{display:flex;flex-direction:column;gap:.6rem;padding-bottom:5rem}
.book-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:.85rem 1rem;display:flex;gap:.8rem;align-items:flex-start;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:box-shadow var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out);
}
.book-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.book-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cond-color,var(--c-accent))}
.book-body{flex:1;min-width:0}
.book-title{font-family:var(--font-display);font-weight:600;font-size:1rem;letter-spacing:-.01em;line-height:1.25;color:var(--ink)}
.book-meta{font-size:.73rem;color:var(--ink-muted);margin-top:.22rem;display:flex;flex-wrap:wrap;gap:.25rem .65rem}
.book-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;align-items:center}
.badge{
  display:inline-flex;align-items:center;gap:.25rem;
  padding:.16rem .55rem;border-radius:var(--radius-pill);
  font-size:.62rem;font-weight:700;letter-spacing:.03em;
}
.badge svg{width:11px;height:11px}
.badge-action{background:var(--line-soft);color:var(--ink-soft)}
.badge-tara{background:var(--tara-black);color:var(--tara-yellow);font-family:var(--font-ui)}
.badge-danio{font-size:.66rem;color:var(--c-muy);font-style:italic}
.shelf-tag{font-size:.62rem;color:var(--ink-muted);font-style:italic;margin-left:auto}
.book-actions{display:flex;flex-direction:column;gap:.2rem;flex-shrink:0}
.icon-btn{
  width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--ink-muted);
  border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  transition:color var(--t-fast),background var(--t-fast);
}
.icon-btn:hover{color:var(--c-accent);background:var(--clay-pale)}
.icon-btn.del:hover{color:#c44;background:rgba(200,60,60,.08)}
.icon-btn svg{width:14px;height:14px}

/* ── Empty ───────────────────────────────────────────────────────── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-muted)}
.empty-state svg{opacity:.18;margin-bottom:1rem}
.empty-state p{font-family:var(--font-display);font-style:italic;font-size:1.05rem;line-height:1.5}

/* ── Taras view ──────────────────────────────────────────────────── */
#tarasView{display:none;padding-bottom:5rem}
.taras-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;gap:.8rem}
.taras-head .hint{font-size:.72rem;color:var(--ink-muted)}
.add-tara-btn{
  display:flex;align-items:center;gap:.35rem;padding:.4rem .85rem;border-radius:var(--radius-md);
  border:1px dashed var(--line);font-size:.76rem;font-weight:600;color:var(--ink-muted);
  background:none;cursor:pointer;transition:all var(--t-fast);white-space:nowrap;
}
.add-tara-btn:hover{border-color:var(--c-accent);color:var(--c-accent)}
.add-tara-btn svg{width:13px;height:13px}

.taras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1rem}

/* heavy-duty plastic bin: black body + yellow lid */
.tara-bin{cursor:pointer;transition:transform var(--t-med) var(--ease-out);filter:drop-shadow(0 6px 10px rgba(42,37,32,.22))}
.tara-bin:hover{transform:translateY(-3px)}
.tara-lid{
  height:15px;margin:0 -3px;
  background:linear-gradient(180deg,var(--tara-yellow) 0%,var(--tara-yellow-d) 100%);
  border-radius:6px 6px 3px 3px;
  border:1px solid var(--tara-yellow-d);
  position:relative;z-index:2;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.35);
}
/* lid clasps */
.tara-lid::before,.tara-lid::after{
  content:'';position:absolute;bottom:-4px;width:18px;height:7px;
  background:linear-gradient(180deg,var(--tara-yellow) 0%,var(--tara-yellow-d) 100%);
  border:1px solid var(--tara-yellow-d);border-top:none;border-radius:0 0 3px 3px;
}
.tara-lid::before{left:14%}
.tara-lid::after{right:14%}
.tara-body{
  background:
    repeating-linear-gradient(90deg,transparent 0,transparent 12px,rgba(0,0,0,.22) 12px,rgba(0,0,0,.22) 14px),
    linear-gradient(180deg,var(--tara-black2) 0%,var(--tara-black) 100%);
  border-radius:2px 2px 8px 8px;
  padding:1rem .6rem .8rem;
  position:relative;
  border:1px solid #15120f;border-top:none;
  /* trapezoid: narrower at bottom */
  clip-path:polygon(0 0,100% 0,93% 100%,7% 100%);
  text-align:center;color:#fff;
  min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:.15rem;
}
/* side handle indents */
.tara-body::before,.tara-body::after{
  content:'';position:absolute;top:30%;width:7px;height:20px;border-radius:3px;
  background:rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.tara-body::before{left:6px}
.tara-body::after{right:6px}
.tara-num{font-family:var(--font-display);font-weight:600;font-size:1.7rem;line-height:1;color:var(--tara-yellow)}
.tara-label{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.tara-count{font-size:.7rem;color:rgba(255,255,255,.82);font-weight:600;margin-top:.1rem}
.tara-nota{font-size:.58rem;color:rgba(255,255,255,.5);font-style:italic;margin-top:.1rem;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Modal (bottom sheet) ────────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(42,37,32,.45);backdrop-filter:blur(3px);
  z-index:200;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--paper);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:1.3rem 1.2rem 2rem;width:min(600px,100%);max-height:92dvh;overflow-y:auto;
  position:relative;box-shadow:0 -8px 32px rgba(42,37,32,.18);
}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto .9rem}
.modal-title{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin-bottom:1rem}
.modal-title em{font-style:italic;color:var(--c-accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.form-group input,.form-group select,.form-group textarea{
  border:1.5px solid var(--line);border-radius:var(--radius-md);background:var(--card);
  font-family:var(--font-ui);font-size:.88rem;color:var(--ink);padding:.45rem .65rem;
  outline:none;transition:border-color var(--t-fast);width:100%;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--c-accent)}
.form-group textarea{resize:vertical;min-height:52px}
.modal-actions{display:flex;gap:.6rem;margin-top:1.1rem;justify-content:space-between;align-items:center}
.modal-actions .right{display:flex;gap:.6rem}
.btn-cancel{padding:.5rem 1.1rem;border-radius:var(--radius-md);border:1.5px solid var(--line);background:none;font-family:var(--font-ui);font-size:.84rem;color:var(--ink-soft);cursor:pointer;transition:all var(--t-fast)}
.btn-cancel:hover{border-color:var(--ink-muted);color:var(--ink)}
.btn-save{padding:.5rem 1.3rem;border-radius:var(--radius-md);border:none;background:var(--c-accent);color:#fff;font-family:var(--font-ui);font-size:.84rem;font-weight:600;cursor:pointer;transition:background var(--t-fast)}
.btn-save:hover{background:var(--clay-dark)}
.btn-del{padding:.5rem .9rem;border-radius:var(--radius-md);border:1.5px solid rgba(200,60,60,.4);background:none;color:#c44;font-family:var(--font-ui);font-size:.84rem;font-weight:600;cursor:pointer;transition:all var(--t-fast)}
.btn-del:hover{background:rgba(200,60,60,.08)}

/* tara detail list inside modal */
.tara-detail-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.3rem}
.tara-detail-item{
  display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
}
.tara-detail-item .pos{font-family:var(--font-display);font-weight:600;color:var(--ink-muted);font-size:.9rem;min-width:22px;text-align:center}
.tara-detail-item .ti{flex:1;min-width:0}
.tara-detail-item .ti .t{font-weight:600;font-size:.85rem;line-height:1.2}
.tara-detail-item .ti .a{font-size:.7rem;color:var(--ink-muted)}

@media(max-width:430px){
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:1}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top-row">
      <a class="back-link" href="casa.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Casa
      </a>
      <div class="sync-row" id="syncRow" hidden><span class="sync-dot" id="syncDot"></span><span id="syncLbl">Local</span></div>
    </div>
    <div class="kicker">Proyecto · Recuperación</div>
    <h1>Recuperación de <em>Libros</em></h1>

    <div class="meta-bar">
      <div class="meta-field"><label>Casa / Propiedad</label><input id="metaCasa" placeholder="Dirección o nombre…"></div>
      <div class="meta-field"><label>Responsable</label><input id="metaResp" placeholder="Tu nombre…"></div>
      <div class="meta-field"><label>Fecha inicio</label><input id="metaFecha" type="date"></div>
    </div>
  </header>

  <div class="stats-row" id="statsRow"></div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="setTab('libros',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      Libros
    </button>
    <button class="tab-btn" onclick="setTab('taras',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
      Taras
    </button>
  </div>

  <!-- ── LIBROS VIEW ────────────────────────────────────────────── -->
  <div id="librosView">
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="searchInput" placeholder="Buscar título, autor…" oninput="renderList()">
      </div>
      <button class="add-btn" onclick="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Agregar
      </button>
    </div>

    <div class="chips" id="filterChips"></div>

    <div class="book-list" id="bookList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <p>Sin libros registrados.<br>Toca <strong>Agregar</strong> para empezar la recuperación.</p>
    </div>
  </div>

  <!-- ── TARAS VIEW ─────────────────────────────────────────────── -->
  <div id="tarasView">
    <div class="taras-head">
      <span class="hint">Toca una tara para ver su contenido</span>
      <button class="add-tara-btn" onclick="addTara()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nueva tara
      </button>
    </div>
    <div class="taras-grid" id="tarasGrid"></div>
    <div class="empty-state" id="tarasEmpty" style="display:none">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
      <p>Sin taras todavía.<br>Crea una o asigna un número al registrar un libro.</p>
    </div>
  </div>
</div>

<!-- Book Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Registrar <em>libro</em></div>
    <div class="form-grid">
      <div class="form-group full"><label>Título *</label><input id="fTitulo" placeholder="Título del libro"></div>
      <div class="form-group"><label>Autor</label><input id="fAutor" placeholder="Apellido, Nombre"></div>
      <div class="form-group"><label>Año</label><input id="fAnio" type="number" placeholder="ej. 1985" min="1400" max="2100"></div>

      <div class="form-group"><label>Ubicación en casa</label><input id="fUbicacion" placeholder="ej. Sala, recámara 2…"></div>

      </div>
      <div class="form-group"><label>Estado · Físico</label>
        <select id="fFisico"><option value="">—</option><option>Bueno</option><option>Dañado</option><option>Muy dañado</option><option>Destruido</option></select>

      <div class="form-group full"><label>Tipo de daño</label><input id="fDanio" placeholder="ej. Humedad, hongos, páginas sueltas…"></div>
      <div class="form-group"><label>Acción a realizar</label>
        <select id="fAccion"><option value="">—</option><option>Limpiar</option><option>Limpiar y reparar</option><option>Restaurar</option><option>Evaluar</option><option>Desechar</option></select>
      </div>
      <div class="form-group"><label>Tara N°</label><input id="fTara" type="number" placeholder="ej. 1, 2, 3…" min="1" onchange="suggestPos()"></div>
      <div class="form-group"><label>Posición en tara</label><input id="fPos" type="number" placeholder="auto" min="1"></div>

      <label>Nota / ubicación de la tara</label>

      <button class="btn-del" onclick="deleteTara()">Eliminar tara</button>
      <div class="right"><button class="btn-save" onclick="closeTaraModal()">Listo</button></div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  RECUPERACIÓN DE LIBROS · datos locales + sync Firebase (offline-first)
// ════════════════════════════════════════════════════════════════════════════

// ── Iconos SVG reutilizables ────────────────────────────────────────────────
const IC = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  oct:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  skull:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2M12 2a8 8 0 00-8 8c0 3.5 2 5 3 6h10c1-1 3-2.5 3-6a8 8 0 00-8-8z"/></svg>',
  dust: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 100-9h-1.8A7 7 0 104 14.9"/><line x1="6" y1="20" x2="6" y2="20"/><line x1="10" y1="21" x2="10" y2="21"/><line x1="14" y1="20" x2="14" y2="20"/></svg>',
  sparkle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
  books:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  box:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>',
};

// ── Metadatos de estado ─────────────────────────────────────────────────────
const FISICO = {
  'Bueno':      {color:'var(--c-bueno)',    bg:'rgba(78,154,82,.14)',  icon:IC.check},
  'Dañado':     {color:'var(--c-danado)',   bg:'rgba(194,135,47,.16)', icon:IC.warn},
  'Muy dañado': {color:'var(--c-muy)',      bg:'rgba(181,96,58,.16)',  icon:IC.oct},
  'Destruido':  {color:'var(--c-destruido)',bg:'rgba(154,51,36,.14)',  icon:IC.skull},
};
const POLVO = {
  'Limpio':        {color:'var(--c-limpio)',bg:'rgba(63,115,104,.14)', icon:IC.sparkle},
  'Empolvado':     {color:'var(--c-danado)',bg:'rgba(194,135,47,.16)', icon:IC.dust},
  'Muy empolvado': {color:'var(--c-muy)',   bg:'rgba(181,96,58,.16)',  icon:IC.dust},
};

// ── Estado ──────────────────────────────────────────────────────────────────
let books = JSON.parse(localStorage.getItem('recup_books') || '[]');
let taras = JSON.parse(localStorage.getItem('recup_taras') || '[]');
let meta  = JSON.parse(localStorage.getItem('recup_meta')  || '{}');
let stateTs = parseInt(localStorage.getItem('recup_ts') || '0', 10);

let editingId = null;
let activeFilter = 'todos';
let activeTab = 'libros';
let openTaraNum = null;

// ── Firebase (offline-first) ─────────────────────────────────────────────────
const FB = {
  apiKey:      "AIzaSyAf1fCH3Fuk0Y0UcrLXjJWCmldu3Aktrmo",
  databaseURL: "https://mi-horario-3746e-default-rtdb.firebaseio.com",
};
let fireDb = null;
let _lastTs = stateTs;       // último timestamp aplicado/escrito
let _applyingRemote = false; // evita eco al aplicar datos remotos

(function initFirebase(){
  if (typeof firebase === 'undefined') return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB);
    fireDb = firebase.database();
    const row = document.getElementById('syncRow');
    const dot = document.getElementById('syncDot');
    const lbl = document.getElementById('syncLbl');
    if (row) row.hidden = false;
    fireDb.ref('.info/connected').on('value', s => {
      if (!dot || !lbl) return;
      if (s.val()) { dot.classList.add('on'); lbl.textContent = 'Sincronizado'; }
      else { dot.classList.remove('on'); lbl.textContent = 'Sin conexión'; }
    });
    // lectura inicial: si remoto es más nuevo lo aplicamos; si local tiene datos y remoto vacío, subimos
    fireDb.ref('recup/state').once('value', s => {
      const v = s.val();
      if (v && v._ts && v._ts > stateTs) applyRemote(v);
      else if ((!v || !v._ts) && (books.length || taras.length)) persist(true);
    });
    // listener en vivo
    fireDb.ref('recup/state').on('value', s => {
      const v = s.val();
      if (!v || !v._ts) return;
      if (v._ts > _lastTs) applyRemote(v);
    });
  } catch(e){ console.warn('Firebase init:', e); }
})();

function applyRemote(v){
  _applyingRemote = true;
  books = Array.isArray(v.books) ? v.books : [];
  taras = Array.isArray(v.taras) ? v.taras : [];
  meta  = v.meta || meta;
  stateTs = v._ts; _lastTs = v._ts;
  persist(false);
  hydrateMeta();
  renderAll();
  _applyingRemote = false;
}

function persist(push = true){
  localStorage.setItem('recup_books', JSON.stringify(books));
  localStorage.setItem('recup_taras', JSON.stringify(taras));
  localStorage.setItem('recup_meta',  JSON.stringify(meta));
  localStorage.setItem('recup_ts',    String(stateTs));
  if (push && fireDb && !_applyingRemote) {
    fireDb.ref('recup/state').set({ books, taras, meta, _ts: stateTs }).catch(()=>{});
  }
}
// commit = mutación local: avanza timestamp y sube
function commit(){
  stateTs = Date.now();
  _lastTs = stateTs;
  persist(true);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function ensureTara(num){
  num = parseInt(num);
  if (!num) return;
  if (!taras.find(t => t.num === num)) taras.push({ num, nota:'' });
}
function taraName(n){ const t = taras.find(x=>x.num===n); return t ? `Tara ${t.num}` : (n?`Tara ${n}`:'Sin tara'); }
function condBadge(map, v){
  if (!v || !map[v]) return '';
  const m = map[v];
  return `<span class="badge" style="color:${m.color};background:${m.bg}">${m.icon}${v}</span>`;
}
function rowColor(b){
  if (b.fisico && FISICO[b.fisico]) return FISICO[b.fisico].color;
  if (b.polvo && POLVO[b.polvo]) return POLVO[b.polvo].color;
  return 'var(--c-accent)';
}

// ── Filtros ─────────────────────────────────────────────────────────────────
const FILTERS = [
  {k:'todos',       label:'Todos',        icon:''},
  {k:'Bueno',       label:'Buen estado',  icon:IC.check},
  {k:'Dañado',      label:'Dañados',      icon:IC.warn},
  {k:'Muy dañado',  label:'Muy dañados',  icon:IC.oct},
  {k:'Destruido',   label:'Destruidos',   icon:IC.skull},
  {k:'Empolvado',   label:'Empolvados',   icon:IC.dust},
  {k:'sin-tara',    label:'Sin tara',     icon:IC.box},
];
function renderChips(){
  document.getElementById('filterChips').innerHTML = FILTERS.map(f =>
    `<div class="chip ${f.k===activeFilter?'active':''}" onclick="setFilter('${f.k}',this)">${f.icon}${f.label}</div>`
  ).join('');
}
function setFilter(f, el){
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}
function filteredBooks(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return books.filter(b => {
    const mq = !q || b.titulo.toLowerCase().includes(q) || (b.autor||'').toLowerCase().includes(q);
    const mf = activeFilter==='todos'    ? true
             : activeFilter==='sin-tara' ? !b.tara
             : activeFilter==='Empolvado'? (b.polvo==='Empolvado'||b.polvo==='Muy empolvado')
             : b.fisico===activeFilter;
    return mq && mf;
  });
}

// ── Modal libro ───────────────────────────────────────────────────────────────
function openModal(id = null){
  editingId = id;
  const b = id ? books.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').innerHTML = id ? 'Editar <em>libro</em>' : 'Registrar <em>libro</em>';
  const set = (f,v)=>document.getElementById(f).value = v||'';
  set('fTitulo',b?.titulo); set('fAutor',b?.autor); set('fAnio',b?.anio);
  set('fEditorial',b?.editorial); set('fIdioma',b?.idioma); set('fGenero',b?.genero);
  set('fUbicacion',b?.ubicacion); set('fPolvo',b?.polvo); set('fFisico',b?.fisico);
  set('fDanio',b?.danio); set('fAccion',b?.accion); set('fTara',b?.tara); set('fPos',b?.pos);
  set('fNotas',b?.notas);
  if (!b) document.getElementById('fFecha') && (document.getElementById('fFecha').value='');
  document.getElementById('btnDel').style.visibility = id ? 'visible' : 'hidden';
  document.getElementById('fTitulo').style.borderColor = '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fTitulo').focus(), 80);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); editingId=null; }
function suggestPos(){
  const tn = parseInt(document.getElementById('fTara').value);
  const posEl = document.getElementById('fPos');
  if (!tn || posEl.value) return;
  const used = books.filter(b=>parseInt(b.tara)===tn && b.id!==editingId).map(b=>parseInt(b.pos)||0);
  posEl.value = (Math.max(0,...used) + 1);
}
function saveBook(){
  const titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo){ const e=document.getElementById('fTitulo'); e.style.borderColor='var(--clay)'; e.focus(); return; }
  const g = id => document.getElementById(id).value;
  const obj = {
    id: editingId || Date.now(),
    titulo,
    autor:g('fAutor').trim(), anio:g('fAnio').trim(), editorial:g('fEditorial').trim(),
    idioma:g('fIdioma'), genero:g('fGenero').trim(), ubicacion:g('fUbicacion').trim(),
    polvo:g('fPolvo'), fisico:g('fFisico'), danio:g('fDanio').trim(), accion:g('fAccion'),
    tara:g('fTara').trim(), pos:g('fPos').trim(), notas:g('fNotas').trim(),
    fecha: editingId ? (books.find(x=>x.id===editingId)?.fecha || todayStr()) : todayStr(),
  };
  if (obj.tara) ensureTara(obj.tara);  // función automática: crea la tara si no existe
  if (editingId){ books[books.findIndex(x=>x.id===editingId)] = obj; }
  else { books.unshift(obj); }
  commit(); closeModal(); renderAll();
}
function deleteCurrent(){ if (editingId) deleteBook(editingId); }
function deleteBook(id){
  if (!confirm('¿Eliminar este libro del registro?')) return;
  books = books.filter(x=>x.id!==id);
  commit(); closeModal(); renderAll();
}

// ── Render lista ──────────────────────────────────────────────────────────────
function renderList(){
  const fb = filteredBooks();
  const list = document.getElementById('bookList');
  const empty = document.getElementById('emptyState');
  if (!fb.length){ list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  list.innerHTML = fb.map(b => {
    const metaTxt = [b.autor, b.anio, b.idioma, b.ubicacion].filter(Boolean).join(' · ');
    return `
    <div class="book-card" style="--cond-color:${rowColor(b)}">
      <div class="book-body">
        <div class="book-title">${esc(b.titulo)}</div>
        ${metaTxt?`<div class="book-meta">${esc(metaTxt)}</div>`:''}
        <div class="book-tags">
          ${condBadge(FISICO,b.fisico)}
          ${condBadge(POLVO,b.polvo)}
          ${b.danio?`<span class="badge-danio">⚠ ${esc(b.danio)}</span>`:''}
          ${b.accion?`<span class="badge badge-action">${esc(b.accion)}</span>`:''}
          ${b.tara?`<span class="badge badge-tara">${IC.box}#${esc(b.tara)}${b.pos?` · pos ${esc(b.pos)}`:''}</span>`:''}
          ${b.genero?`<span class="shelf-tag">${esc(b.genero)}</span>`:''}
        </div>
      </div>
      <div class="book-actions">
        <button class="icon-btn" title="Editar" onclick="openModal(${b.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="icon-btn del" title="Eliminar" onclick="deleteBook(${b.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
      </div>
    </div>`;
  }).join('');
}

// ── Render taras (bins negros/tapa amarilla) ──────────────────────────────────
function renderTaras(){
  const grid = document.getElementById('tarasGrid');
  const empty = document.getElementById('tarasEmpty');
  const count = {};
  books.forEach(b => { const n=parseInt(b.tara); if(n) count[n]=(count[n]||0)+1; });

  const sorted = [...taras].sort((a,b)=>a.num-b.num);
  if (!sorted.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = sorted.map(t => {
    const c = count[t.num] || 0;
    return `
    <div class="tara-bin" onclick="openTara(${t.num})">
      <div class="tara-lid"></div>
      <div class="tara-body">
        <div class="tara-label">Tara</div>
        <div class="tara-num">${t.num}</div>
        <div class="tara-count">${c} libro${c!==1?'s':''}</div>
        ${t.nota?`<div class="tara-nota">${esc(t.nota)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
function addTara(){
  const next = (Math.max(0,...taras.map(t=>t.num))) + 1;
  const v = prompt('Número de la nueva tara:', next);
  if (v === null) return;
  const num = parseInt(v);
  if (!num){ alert('Número inválido'); return; }
  if (taras.find(t=>t.num===num)){ alert('Esa tara ya existe'); return; }
  taras.push({ num, nota:'' });
  commit(); renderTaras();
}
function openTara(num){
  openTaraNum = num;
  const t = taras.find(x=>x.num===num);
  document.getElementById('taraModalTitle').innerHTML = `Tara <em>${num}</em>`;
  document.getElementById('taraNotaInput').value = t?.nota || '';
  const inside = books.filter(b=>parseInt(b.tara)===num)
                      .sort((a,b)=>(parseInt(a.pos)||999)-(parseInt(b.pos)||999));
  const list = document.getElementById('taraDetailList');
  list.innerHTML = inside.length ? inside.map(b => `
    <div class="tara-detail-item" onclick="closeTaraModal();openModal(${b.id})">
      <div class="pos">${b.pos||'·'}</div>
      <div class="ti"><div class="t">${esc(b.titulo)}</div><div class="a">${esc([b.autor,b.fisico].filter(Boolean).join(' · ')||'—')}</div></div>
      ${b.fisico?`<span class="badge" style="color:${FISICO[b.fisico]?.color||'var(--ink)'};background:${FISICO[b.fisico]?.bg||'var(--line-soft)'}">${FISICO[b.fisico]?.icon||''}</span>`:''}
    </div>`).join('') : '<p style="text-align:center;color:var(--ink-muted);font-style:italic;padding:1rem 0">Tara vacía</p>';
  document.getElementById('taraModalOverlay').classList.add('open');
}
function closeTaraModal(){
  if (openTaraNum != null){
    const t = taras.find(x=>x.num===openTaraNum);
    const nota = document.getElementById('taraNotaInput').value.trim();
    if (t && t.nota !== nota){ t.nota = nota; commit(); renderTaras(); }
  }
  document.getElementById('taraModalOverlay').classList.remove('open');
  openTaraNum = null;
}
function deleteTara(){
  if (openTaraNum == null) return;
  const inside = books.filter(b=>parseInt(b.tara)===openTaraNum).length;
  const msg = inside ? `Esta tara tiene ${inside} libro(s). Se quitará la asignación de tara a esos libros. ¿Continuar?`
                     : '¿Eliminar esta tara?';
  if (!confirm(msg)) return;
  books.forEach(b => { if(parseInt(b.tara)===openTaraNum){ b.tara=''; b.pos=''; } });
  taras = taras.filter(t=>t.num!==openTaraNum);
  commit();
  document.getElementById('taraModalOverlay').classList.remove('open');
  openTaraNum = null;
  renderAll();
}

// ── Stats ───────────────────────────────────────────────────────────────────
function renderStats(){
  const total = books.length;
  const bueno = books.filter(b=>b.fisico==='Bueno').length;
  const danados = books.filter(b=>b.fisico==='Dañado'||b.fisico==='Muy dañado').length;
  const destruidos = books.filter(b=>b.fisico==='Destruido').length;
  const usedTaras = new Set(books.map(b=>parseInt(b.tara)).filter(Boolean));
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill">${IC.books}<span class="num">${total}</span> total</div>
    <div class="stat-pill bueno">${IC.check}<span class="num">${bueno}</span> buenos</div>
    <div class="stat-pill danado">${IC.warn}<span class="num">${danados}</span> dañados</div>
    <div class="stat-pill destruido">${IC.skull}<span class="num">${destruidos}</span> destruidos</div>
    <div class="stat-pill taras">${IC.box}<span class="num">${usedTaras.size}</span> taras</div>`;
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function setTab(tab, el){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('librosView').style.display = tab==='libros'?'block':'none';
  document.getElementById('tarasView').style.display  = tab==='taras'?'block':'none';
  if (tab==='taras') renderTaras();
}

function renderAll(){ renderStats(); renderChips(); renderList(); if(activeTab==='taras') renderTaras(); }

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayStr(){ return new Date().toISOString().split('T')[0]; }

// ── Meta (casa/responsable/fecha) ──────────────────────────────────────────────
function hydrateMeta(){
  document.getElementById('metaCasa').value  = meta.casa  || '';
  document.getElementById('metaResp').value  = meta.resp  || '';
  document.getElementById('metaFecha').value = meta.fecha || todayStr();
}
['metaCasa','metaResp','metaFecha'].forEach(id => {
  document.getElementById(id).addEventListener('change', function(){
    meta.casa  = document.getElementById('metaCasa').value;
    meta.resp  = document.getElementById('metaResp').value;
    meta.fecha = document.getElementById('metaFecha').value;
    commit();
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.getElementById('taraModalOverlay').addEventListener('click', function(e){ if(e.target===this) closeTaraModal(); });

hydrateMeta();
renderAll();
</script>
</body>
</html>
