<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Biblioteca · AV</title>
<meta name="theme-color" content="#7a5c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe4;--card:#fbf8f1;
  --ink:#2a2520;--ink-soft:#5a5247;--ink-muted:#8a7d70;
  --line:#ddd3bf;--line-soft:#ede7d9;
  --clay:#b5603a;--clay-pale:rgba(181,96,58,.10);--clay-dark:#8f4a2a;
  --c-accent:#7a5c3a;--c-accent-pale:rgba(122,92,58,.10);
  --c-leyendo:#3f7368;--c-leido:#4a6b8a;--c-pendiente:#7a5c3a;--c-abandonado:#8a7d70;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Hanken Grotesk',system-ui,sans-serif;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
  --shadow-sm:0 2px 8px -2px rgba(42,37,32,.08);
  --shadow-md:0 6px 20px -6px rgba(42,37,32,.16);
  --shadow-book:2px 4px 12px rgba(42,37,32,.25);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --t-fast:.14s;--t-med:.24s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(circle at 20% -10%,#faf6ec 0%,transparent 50%);
  background-attachment:fixed;
}

/* ── Header ──────────────────────────────────────────────────────── */
.wrap{max-width:580px;margin:0 auto;padding:0 1.15rem}
header{padding:1.8rem 0 1.2rem}
.back-link{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.75rem;font-weight:600;color:var(--ink-muted);
  text-decoration:none;letter-spacing:.05em;margin-bottom:1rem;
  transition:color var(--t-fast);
}
.back-link:hover{color:var(--c-accent)}
.back-link svg{width:13px;height:13px}
.kicker{font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:var(--c-accent);font-weight:700}
h1{
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(1.7rem,6vw,2.2rem);line-height:1;letter-spacing:-.02em;margin-top:.4rem;
}
h1 em{font-style:italic;color:var(--c-accent)}

/* ── Stats pills ─────────────────────────────────────────────────── */
.stats-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 1.2rem}
.stat-pill{
  display:flex;align-items:center;gap:.4rem;
  padding:.28rem .7rem;border-radius:var(--radius-pill);
  font-size:.72rem;font-weight:600;background:var(--card);
  border:1px solid var(--line);color:var(--ink-soft);
}
.stat-pill .num{font-family:var(--font-display);font-size:1rem;font-weight:600;color:var(--ink);line-height:1}
.stat-pill.leyendo .num{color:var(--c-leyendo)}
.stat-pill.leido   .num{color:var(--c-leido)}

/* ── Tabs ────────────────────────────────────────────────────────── */
.tab-bar{
  display:flex;gap:0;border-bottom:2px solid var(--line);
  margin-bottom:1.2rem;
}
.tab-btn{
  padding:.55rem 1.1rem;font-size:.8rem;font-weight:600;
  color:var(--ink-muted);background:none;border:none;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color var(--t-fast),border-color var(--t-fast);letter-spacing:.01em;
}
.tab-btn.active{color:var(--c-accent);border-bottom-color:var(--c-accent)}

/* ── Toolbar ─────────────────────────────────────────────────────── */
.toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
.search-wrap{
  flex:1;min-width:160px;display:flex;align-items:center;gap:.5rem;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:.42rem .75rem;
}
.search-wrap svg{width:14px;height:14px;color:var(--ink-muted);flex-shrink:0}
.search-wrap input{
  flex:1;border:none;background:none;font-family:var(--font-ui);
  font-size:.85rem;color:var(--ink);outline:none;
}
.search-wrap input::placeholder{color:var(--ink-muted)}
.add-btn{
  display:flex;align-items:center;gap:.4rem;
  padding:.44rem 1rem;border-radius:var(--radius-md);
  background:var(--c-accent);color:#fff;border:none;cursor:pointer;
  font-family:var(--font-ui);font-size:.82rem;font-weight:600;
  transition:background var(--t-fast);white-space:nowrap;flex-shrink:0;
}
.add-btn:hover{background:var(--clay-dark)}
.add-btn svg{width:14px;height:14px}

/* ── Filter chips ────────────────────────────────────────────────── */
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{
  padding:.22rem .65rem;border-radius:var(--radius-pill);
  font-size:.7rem;font-weight:600;cursor:pointer;
  border:1px solid var(--line);color:var(--ink-muted);background:var(--card);
  transition:all var(--t-fast);
}
.chip:hover{border-color:var(--c-accent);color:var(--c-accent)}
.chip.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}

/* ── Book cards (lista view) ─────────────────────────────────────── */
.book-list{display:flex;flex-direction:column;gap:.6rem;padding-bottom:5rem}
.book-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:.9rem 1rem;
  display:flex;gap:.8rem;align-items:flex-start;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:box-shadow var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out);
}
.book-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.book-spine{
  width:8px;flex-shrink:0;align-self:stretch;
  border-radius:3px;background:var(--spine-color,var(--clay));
  opacity:.85;
}
.book-body{flex:1;min-width:0}
.book-title{
  font-family:var(--font-display);font-weight:600;font-size:1rem;
  letter-spacing:-.01em;line-height:1.25;color:var(--ink);
}
.book-meta{
  font-size:.73rem;color:var(--ink-muted);margin-top:.25rem;
  display:flex;flex-wrap:wrap;gap:.3rem .7rem;
}
.book-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.45rem;align-items:center}
.status-badge{
  padding:.15rem .55rem;border-radius:var(--radius-pill);
  font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
.status-Leyendo  {background:rgba(63,115,104,.14);color:var(--c-leyendo)}
.status-Leído    {background:rgba(74,107,138,.14);color:var(--c-leido)}
.status-Pendiente{background:var(--c-accent-pale);color:var(--c-accent)}
.status-Abandonado{background:rgba(138,125,112,.14);color:var(--ink-muted)}
.status-Referencia{background:rgba(42,37,32,.07);color:var(--ink-soft)}
.genre-tag{
  font-size:.62rem;color:var(--ink-muted);
  background:var(--line-soft);padding:.1rem .45rem;border-radius:var(--radius-pill);
}
.shelf-tag{
  font-size:.62rem;color:var(--ink-muted);font-style:italic;
  margin-left:auto;
}
.stars{font-size:.75rem;color:var(--clay);letter-spacing:-.05em}
.book-actions{display:flex;flex-direction:column;gap:.2rem;flex-shrink:0}
.icon-btn{
  width:28px;height:28px;border:none;background:none;cursor:pointer;
  color:var(--ink-muted);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  transition:color var(--t-fast),background var(--t-fast);
}
.icon-btn:hover{color:var(--c-accent);background:var(--clay-pale)}
.icon-btn.del:hover{color:#c44;background:rgba(200,60,60,.08)}
.icon-btn svg{width:14px;height:14px}

/* ── Empty state ─────────────────────────────────────────────────── */
.empty-state{
  text-align:center;padding:3.5rem 1rem;color:var(--ink-muted);
}
.empty-state svg{opacity:.18;margin-bottom:1rem}
.empty-state p{font-family:var(--font-display);font-style:italic;font-size:1.05rem;line-height:1.5}

/* ── Shelf view ──────────────────────────────────────────────────── */
#shelfView{display:none;padding-bottom:5rem}
.shelf-selector{
  display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem;align-items:center;
}
.shelf-selector label{font-size:.73rem;font-weight:600;color:var(--ink-muted);margin-right:.2rem}
.shelf-btn{
  padding:.28rem .75rem;border-radius:var(--radius-pill);border:1px solid var(--line);
  font-size:.75rem;font-weight:600;color:var(--ink-muted);background:var(--card);
  cursor:pointer;transition:all var(--t-fast);
}
.shelf-btn.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
.shelf-btn:hover:not(.active){border-color:var(--c-accent);color:var(--c-accent)}
.add-shelf-btn{
  padding:.28rem .7rem;border-radius:var(--radius-pill);
  border:1px dashed var(--line);font-size:.73rem;color:var(--ink-muted);
  background:none;cursor:pointer;transition:all var(--t-fast);
}
.add-shelf-btn:hover{border-color:var(--c-accent);color:var(--c-accent)}

/* bookshelf rack */
.shelf-rack{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:1.2rem 1rem 0;position:relative;margin-bottom:1.5rem;
  box-shadow:var(--shadow-sm);
}
.shelf-rack-label{
  font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-muted);margin-bottom:.9rem;
}
.books-grid{
  display:flex;flex-wrap:wrap;gap:.65rem;min-height:130px;padding-bottom:1rem;
  align-items:flex-end;
}
/* the shelf plank */
.shelf-rack::after{
  content:'';display:block;
  height:10px;background:linear-gradient(to bottom,var(--c-accent) 0%,var(--clay-dark) 100%);
  border-radius:0 0 var(--radius-md) var(--radius-md);
  margin:0 -1rem;opacity:.55;
}
.cover-card{
  width:72px;
  aspect-ratio:2/3;
  border-radius:3px 5px 5px 3px;
  background:var(--cv-color,#b5603a);
  box-shadow:var(--shadow-book);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:6px 5px 5px;
  cursor:pointer;
  position:relative;
  transition:transform var(--t-med) var(--ease-out),box-shadow var(--t-med) var(--ease-out);
  overflow:hidden;
}
.cover-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:rgba(0,0,0,.2);border-radius:3px 0 0 3px;
}
.cover-card:hover{transform:translateY(-5px) scale(1.04);box-shadow:3px 8px 18px rgba(42,37,32,.3)}
.cover-title{
  font-family:var(--font-display);font-size:.5rem;font-weight:600;
  color:rgba(255,255,255,.95);line-height:1.25;
  word-break:break-word;hyphens:auto;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.cover-author{
  font-size:.44rem;color:rgba(255,255,255,.7);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-weight:500;
}
.cover-status-dot{
  position:absolute;top:4px;right:4px;
  width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);
}
.cover-status-dot.Leyendo{background:#7fe0c8}
.cover-status-dot.Leído{background:#a0c0e0}
.shelf-empty{
  width:100%;text-align:center;font-family:var(--font-display);
  font-style:italic;color:var(--ink-muted);font-size:.9rem;
  padding:1.5rem 0;opacity:.6;
}

/* ── Modal ───────────────────────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(42,37,32,.45);backdrop-filter:blur(3px);
  z-index:200;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--paper);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:1.4rem 1.2rem 2rem;
  width:min(580px,100%);max-height:92dvh;overflow-y:auto;
  position:relative;box-shadow:0 -8px 32px rgba(42,37,32,.18);
}
.modal-handle{
  width:36px;height:4px;background:var(--line);border-radius:2px;
  margin:0 auto .9rem;
}
.modal-title{
  font-family:var(--font-display);font-weight:600;font-size:1.15rem;
  margin-bottom:1.1rem;
}
.modal-title em{font-style:italic;color:var(--c-accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
.form-group.full{grid-column:1/-1}
.form-group label{
  font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-muted);
}
.form-group input,.form-group select,.form-group textarea{
  border:1.5px solid var(--line);border-radius:var(--radius-md);
  background:var(--card);font-family:var(--font-ui);
  font-size:.88rem;color:var(--ink);padding:.45rem .65rem;
  outline:none;transition:border-color var(--t-fast);width:100%;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--c-accent);
}
.form-group textarea{resize:vertical;min-height:56px}
.star-input{display:flex;gap:.3rem;align-items:center}
.star-btn{
  background:none;border:none;font-size:1.1rem;cursor:pointer;
  color:var(--line);transition:color var(--t-fast);padding:.1rem;
}
.star-btn.on{color:var(--clay)}
.modal-actions{display:flex;gap:.6rem;margin-top:1.1rem;justify-content:flex-end}
.btn-cancel{
  padding:.5rem 1.1rem;border-radius:var(--radius-md);border:1.5px solid var(--line);
  background:none;font-family:var(--font-ui);font-size:.84rem;
  color:var(--ink-soft);cursor:pointer;transition:all var(--t-fast);
}
.btn-cancel:hover{border-color:var(--ink-muted);color:var(--ink)}
.btn-save{
  padding:.5rem 1.3rem;border-radius:var(--radius-md);border:none;
  background:var(--c-accent);color:#fff;font-family:var(--font-ui);
  font-size:.84rem;font-weight:600;cursor:pointer;
  transition:background var(--t-fast);
}
.btn-save:hover{background:var(--clay-dark)}

@media(max-width:420px){
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:1}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back-link" href="casa.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Casa
    </a>
    <div class="kicker">Alejandro Villarreal · AAAV</div>
    <h1>Mi <em>Biblioteca</em></h1>
  </header>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="setTab('lista',this)">Lista</button>
    <button class="tab-btn" onclick="setTab('estanteria',this)">Estantería</button>
  </div>

  <!-- ── LISTA VIEW ─────────────────────────────────────────────── -->
  <div id="listaView">
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="searchInput" placeholder="Buscar título, autor…" oninput="renderList()">
      </div>
      <button class="add-btn" onclick="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Agregar
      </button>
    </div>

    <div class="chips" id="filterChips">
      <div class="chip active" onclick="setFilter('todos',this)">Todos</div>
      <div class="chip" onclick="setFilter('Leyendo',this)">Leyendo</div>
      <div class="chip" onclick="setFilter('Leído',this)">Leídos</div>
      <div class="chip" onclick="setFilter('Pendiente',this)">Pendientes</div>
      <div class="chip" onclick="setFilter('Abandonado',this)">Abandonados</div>
    </div>

    <div class="book-list" id="bookList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
      </svg>
      <p>Sin libros aquí todavía.<br>Toca <strong>Agregar</strong> para empezar.</p>
    </div>
  </div>

  <!-- ── ESTANTERÍA VIEW ────────────────────────────────────────── -->
  <div id="shelfView">
    <div class="shelf-selector">
      <label>Estante:</label>
      <div id="shelfBtns"></div>
      <button class="add-shelf-btn" onclick="addShelf()">+ Nuevo estante</button>
    </div>
    <div id="shelfRack"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Agregar <em>libro</em></div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Título *</label>
        <input id="fTitulo" placeholder="Título del libro">
      </div>
      <div class="form-group">
        <label>Autor</label>
        <input id="fAutor" placeholder="Apellido, Nombre">
      </div>
      <div class="form-group">
        <label>Año</label>
        <input id="fAnio" type="number" placeholder="ej. 1985" min="1400" max="2100">
      </div>
      <div class="form-group">
        <label>Editorial</label>
        <input id="fEditorial" placeholder="Editorial">
      </div>
      <div class="form-group">
        <label>Idioma</label>
        <select id="fIdioma">
          <option value="">—</option>
          <option>Español</option><option>Inglés</option><option>Portugués</option>
          <option>Francés</option><option>Alemán</option><option>Italiano</option><option>Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Género / Tema</label>
        <input id="fGenero" placeholder="ej. Novela, Técnico…">
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="fEstado">
          <option value="Pendiente">Pendiente</option>
          <option value="Leyendo">Leyendo</option>
          <option value="Leído">Leído</option>
          <option value="Abandonado">Abandonado</option>
          <option value="Referencia">Referencia</option>
        </select>
      </div>
      <div class="form-group">
        <label>Estante</label>
        <select id="fEstante"></select>
      </div>
      <div class="form-group">
        <label>Calificación</label>
        <div class="star-input" id="starInput">
          <button class="star-btn" type="button" data-v="1" onclick="setStar(1)">★</button>
          <button class="star-btn" type="button" data-v="2" onclick="setStar(2)">★</button>
          <button class="star-btn" type="button" data-v="3" onclick="setStar(3)">★</button>
          <button class="star-btn" type="button" data-v="4" onclick="setStar(4)">★</button>
          <button class="star-btn" type="button" data-v="5" onclick="setStar(5)">★</button>
        </div>
      </div>
      <div class="form-group full">
        <label>Notas</label>
        <textarea id="fNotas" placeholder="Observaciones, opinión…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveBook()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── Palette de portadas ────────────────────────────────────────────────────────
const COVER_PALETTE = [
  '#a05030','#6a7d5a','#4a6878','#7a5890','#b08040',
  '#3d7260','#8a5050','#5a6888','#886840','#4a7870',
  '#906858','#5a7840','#3a5880','#7a4870','#a07850'
];
function coverColor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (Math.imul(31, h) + seed.charCodeAt(i)) | 0;
  return COVER_PALETTE[Math.abs(h) % COVER_PALETTE.length];
}

// ── State ─────────────────────────────────────────────────────────────────────
let books   = JSON.parse(localStorage.getItem('libros_av')   || '[]');
let shelves = JSON.parse(localStorage.getItem('estantes_av') || '[{"num":1,"nombre":"Estante 1"}]');
let editingId    = null;
let activeFilter = 'todos';
let activeTab    = 'lista';
let activeShelf  = 1;
let currentStars = 0;

function persist() {
  localStorage.setItem('libros_av',   JSON.stringify(books));
  localStorage.setItem('estantes_av', JSON.stringify(shelves));
}

// ── Stars ─────────────────────────────────────────────────────────────────────
function setStar(v) {
  currentStars = currentStars === v ? 0 : v;
  renderStars(currentStars);
}
function renderStars(v) {
  document.querySelectorAll('.star-btn').forEach(b => {
    b.classList.toggle('on', parseInt(b.dataset.v) <= v);
  });
}
function starsHtml(v) {
  if (!v) return '';
  return '★'.repeat(v) + '☆'.repeat(5 - v);
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(id = null) {
  editingId = id;
  const b = id ? books.find(x => x.id === id) : null;
  document.getElementById('modalTitle').innerHTML = id ? 'Editar <em>libro</em>' : 'Agregar <em>libro</em>';

  document.getElementById('fTitulo').value    = b?.titulo    || '';
  document.getElementById('fAutor').value     = b?.autor     || '';
  document.getElementById('fAnio').value      = b?.anio      || '';
  document.getElementById('fEditorial').value = b?.editorial || '';
  document.getElementById('fIdioma').value    = b?.idioma    || '';
  document.getElementById('fGenero').value    = b?.genero    || '';
  document.getElementById('fEstado').value    = b?.estado    || 'Pendiente';
  document.getElementById('fNotas').value     = b?.notas     || '';

  currentStars = b?.stars || 0;
  renderStars(currentStars);
  populateShelfSelect(b?.estante ?? 1);

  document.getElementById('fTitulo').style.borderColor = '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fTitulo').focus(), 80);
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}
function populateShelfSelect(sel) {
  const el = document.getElementById('fEstante');
  el.innerHTML = shelves.map(s =>
    `<option value="${s.num}" ${s.num === sel ? 'selected' : ''}>${s.nombre}</option>`
  ).join('');
}

function saveBook() {
  const titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo) {
    document.getElementById('fTitulo').style.borderColor = 'var(--clay)';
    document.getElementById('fTitulo').focus();
    return;
  }
  const obj = {
    id:        editingId || Date.now(),
    titulo,
    autor:     document.getElementById('fAutor').value.trim(),
    anio:      document.getElementById('fAnio').value.trim(),
    editorial: document.getElementById('fEditorial').value.trim(),
    idioma:    document.getElementById('fIdioma').value,
    genero:    document.getElementById('fGenero').value.trim(),
    estado:    document.getElementById('fEstado').value,
    estante:   parseInt(document.getElementById('fEstante').value) || 1,
    notas:     document.getElementById('fNotas').value.trim(),
    stars:     currentStars,
    added:     editingId ? (books.find(x => x.id === editingId)?.added || Date.now()) : Date.now(),
  };
  if (editingId) {
    const idx = books.findIndex(x => x.id === editingId);
    books[idx] = obj;
  } else {
    books.unshift(obj); // newest first
  }
  persist(); closeModal(); renderAll();
}

function deleteBook(id) {
  if (!confirm('¿Eliminar este libro?')) return;
  books = books.filter(x => x.id !== id);
  persist(); renderAll();
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}
function filteredBooks() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return books.filter(b => {
    const matchQ = !q || b.titulo.toLowerCase().includes(q) || (b.autor||'').toLowerCase().includes(q);
    const matchF = activeFilter === 'todos' ? true : b.estado === activeFilter;
    return matchQ && matchF;
  });
}

// ── Render list ───────────────────────────────────────────────────────────────
function renderList() {
  const fb = filteredBooks();
  const list  = document.getElementById('bookList');
  const empty = document.getElementById('emptyState');

  if (!fb.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const shelfName = n => shelves.find(s => s.num === n)?.nombre || `Estante ${n}`;

  list.innerHTML = fb.map(b => {
    const col = coverColor(b.titulo);
    const meta = [b.autor, b.anio, b.idioma].filter(Boolean).join(' · ');
    return `
    <div class="book-card">
      <div class="book-spine" style="--spine-color:${col}"></div>
      <div class="book-body">
        <div class="book-title">${b.titulo}</div>
        ${meta ? `<div class="book-meta">${meta}</div>` : ''}
        <div class="book-tags">
          <span class="status-badge status-${b.estado}">${b.estado}</span>
          ${b.genero ? `<span class="genre-tag">${b.genero}</span>` : ''}
          ${b.stars  ? `<span class="stars">${starsHtml(b.stars)}</span>` : ''}
          <span class="shelf-tag">${shelfName(b.estante||1)}</span>
        </div>
      </div>
      <div class="book-actions">
        <button class="icon-btn" title="Editar" onclick="openModal(${b.id})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn del" title="Eliminar" onclick="deleteBook(${b.id})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── Render shelf ──────────────────────────────────────────────────────────────
function setShelf(n) {
  activeShelf = n;
  document.querySelectorAll('.shelf-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.n) === n));
  renderShelfGrid();
}
function addShelf() {
  const num = (Math.max(...shelves.map(s => s.num), 0)) + 1;
  const nombre = prompt(`Nombre del nuevo estante:`, `Estante ${num}`);
  if (nombre === null) return;
  shelves.push({ num, nombre: nombre.trim() || `Estante ${num}` });
  persist(); renderShelfButtons(); setShelf(num);
}
function renderShelfButtons() {
  const wrap = document.getElementById('shelfBtns');
  wrap.innerHTML = shelves.map(s =>
    `<button class="shelf-btn ${s.num === activeShelf ? 'active' : ''}" data-n="${s.num}" onclick="setShelf(${s.num})">${s.nombre}</button>`
  ).join(' ');
}
function renderShelfGrid() {
  const rack = document.getElementById('shelfRack');
  const shelf = shelves.find(s => s.num === activeShelf);
  const shelfBooks = books.filter(b => (b.estante || 1) === activeShelf);

  rack.innerHTML = `
    <div class="shelf-rack">
      <div class="shelf-rack-label">${shelf?.nombre || 'Estante ' + activeShelf} · ${shelfBooks.length} libro${shelfBooks.length !== 1 ? 's' : ''}</div>
      <div class="books-grid">
        ${shelfBooks.length ? shelfBooks.map(b => {
          const col = coverColor(b.titulo);
          const titleShort = b.titulo.length > 45 ? b.titulo.slice(0,44) + '…' : b.titulo;
          return `<div class="cover-card" style="--cv-color:${col}" onclick="openModal(${b.id})" title="${b.titulo}${b.autor ? ' — ' + b.autor : ''}">
            <div class="cover-status-dot ${b.estado}"></div>
            <div class="cover-title">${titleShort}</div>
            <div class="cover-author">${b.autor || ''}</div>
          </div>`;
        }).join('') : '<div class="shelf-empty">Estante vacío</div>'}
      </div>
    </div>`;
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const total    = books.length;
  const leyendo  = books.filter(b => b.estado === 'Leyendo').length;
  const leidos   = books.filter(b => b.estado === 'Leído').length;
  const pendientes = books.filter(b => b.estado === 'Pendiente').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill"><span class="num">${total}</span> total</div>
    <div class="stat-pill leyendo"><span class="num">${leyendo}</span> leyendo</div>
    <div class="stat-pill leido"><span class="num">${leidos}</span> leídos</div>
    <div class="stat-pill"><span class="num">${pendientes}</span> pendientes</div>`;
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function setTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('listaView').style.display   = tab === 'lista' ? '' : 'none';
  document.getElementById('shelfView').style.display   = tab === 'estanteria' ? '' : 'none';
  if (tab === 'estanteria') { renderShelfButtons(); renderShelfGrid(); }
}

function renderAll() {
  renderStats();
  renderList();
  if (activeTab === 'estanteria') { renderShelfButtons(); renderShelfGrid(); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
// close on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ensure Estante 1 always exists
if (!shelves.find(s => s.num === 1)) {
  shelves.unshift({ num: 1, nombre: 'Estante 1' });
  persist();
}

renderAll();
</script>
</body>
</html>
