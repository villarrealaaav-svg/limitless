<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hábitos · AV</title>
<meta name="theme-color" content="#6b5b95">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#f4efe4;--card:#fbf8f1;
  --ink:#2a2520;--ink-soft:#5a5247;--ink-muted:#8a7d70;
  --line:#ddd3bf;--line-soft:#ede7d9;
  --c-accent:#6b5b95;--c-accent-pale:rgba(107,91,149,.12);--c-accent-dark:#54477a;
  --c-good:#3f7368;--c-late:#b5603a;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Hanken Grotesk',system-ui,sans-serif;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
  --shadow-sm:0 2px 8px -2px rgba(42,37,32,.08);
  --shadow-md:0 6px 20px -6px rgba(42,37,32,.16);
  --ease-out:cubic-bezier(.22,1,.36,1);--t-fast:.14s;--t-med:.24s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(circle at 20% -10%,#faf6ec 0%,transparent 50%);
  background-attachment:fixed;
}
.wrap{max-width:560px;margin:0 auto;padding:0 1.15rem}
header{padding:1.7rem 0 1rem}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:.7rem}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:600;color:var(--ink-muted);text-decoration:none;letter-spacing:.05em;margin-bottom:1rem;transition:color var(--t-fast)}
.back-link:hover{color:var(--c-accent)}
.back-link svg{width:13px;height:13px}
.hrow{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.sync-row{display:flex;align-items:center;gap:.35rem;font-size:.66rem;color:var(--ink-muted);font-weight:600}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;transition:background .6s}
.sync-dot.on{background:#3a7a3e}
.notif-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:.22rem .6rem;cursor:pointer;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);font-family:var(--font-ui);transition:.15s}
.notif-btn:hover{border-color:var(--c-accent);color:var(--c-accent)}
.notif-btn.on{border-color:var(--c-good);color:var(--c-good)}
.kicker{font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:var(--c-accent);font-weight:700}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.05;letter-spacing:-.02em;margin-top:.4rem}
h1 em{font-style:italic;color:var(--c-accent)}

.tab-bar{display:flex;border-bottom:2px solid var(--line);margin:1rem 0 1.1rem}
.tab-btn{padding:.55rem 1.1rem;font-size:.84rem;font-weight:600;color:var(--ink-muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color var(--t-fast),border-color var(--t-fast)}
.tab-btn.active{color:var(--c-accent);border-bottom-color:var(--c-accent)}

/* progreso de hoy */
.today-card{background:var(--c-accent);color:#fff;border-radius:var(--radius-lg);padding:1.05rem 1.15rem;box-shadow:var(--shadow-md);margin-bottom:1.1rem;display:flex;align-items:center;gap:1rem}
.ring{width:62px;height:62px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:.95rem}
.today-card .tinfo{flex:1;min-width:0}
.today-card .tlbl{font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.today-card .tval{font-family:var(--font-display);font-weight:600;font-size:1.45rem;line-height:1.15;margin-top:.1rem}
.today-card .tsub{font-size:.72rem;color:rgba(255,255,255,.82);margin-top:.15rem}

.add-trip-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;border-radius:var(--radius-lg);background:var(--c-accent);color:#fff;border:none;cursor:pointer;font-family:var(--font-ui);font-size:.92rem;font-weight:600;margin-bottom:1.2rem;transition:background var(--t-fast)}
.add-trip-btn:hover{background:var(--c-accent-dark)}
.add-trip-btn svg{width:17px;height:17px}

/* fila de hábito */
.hab{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:.62rem .85rem;margin-bottom:.45rem;box-shadow:var(--shadow-sm);transition:box-shadow var(--t-med),transform var(--t-med),opacity var(--t-med)}
.hab:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.hab.done{opacity:.62}
.hab .hico{font-size:1.25rem;width:28px;text-align:center;flex-shrink:0}
.hab .hinfo{flex:1;min-width:0;cursor:pointer}
.hab .hname{font-size:.92rem;font-weight:600;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hab.done .hname{text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.hab .hmeta{font-size:.7rem;color:var(--ink-muted);margin-top:.05rem}
.hab .hmeta b{font-weight:600;color:var(--ink-soft)}
.hab .hmeta .late{color:var(--c-late);font-weight:700}
.hab .hstreak{font-size:.7rem;font-weight:700;color:var(--c-late);flex-shrink:0}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);padding:0}
.check:hover{border-color:var(--c-accent)}
.check svg{width:15px;height:15px;stroke:#fff;opacity:0;transition:opacity var(--t-fast)}
.check.on{background:var(--c-good);border-color:var(--c-good)}
.check.on svg{opacity:1}

.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-muted)}
.empty-state svg{opacity:.18;margin-bottom:1rem}
.empty-state p{font-family:var(--font-display);font-style:italic;font-size:1.05rem;line-height:1.5}

/* resumen */
.resumen-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:var(--shadow-sm)}
.st{display:flex;align-items:center;gap:.75rem;padding:.6rem .1rem;border-bottom:1px solid var(--line-soft)}
.st:last-child{border-bottom:none}
.st .sico{font-size:1.25rem;width:28px;text-align:center;flex-shrink:0}
.st .sbody{flex:1;min-width:0}
.st .stop{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.3rem}
.st .sname{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .spct{font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--c-accent);flex-shrink:0}
.st .sbar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.st .sbar i{display:block;height:100%;background:var(--c-accent);border-radius:4px;transition:width .4s var(--ease-out)}
.st .smeta{font-size:.68rem;color:var(--ink-muted);font-weight:600;margin-top:.25rem}
.dots{display:flex;gap:3px;margin-top:.3rem}
.dots i{width:100%;max-width:14px;height:14px;border-radius:3px;background:var(--line-soft);display:block}
.dots i.on{background:var(--c-good)}
.dots i.na{background:transparent;border:1px dashed var(--line)}

.section-label{font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);margin:.4rem 0 .9rem;display:flex;align-items:center;gap:.7rem}
.section-label::after{content:'';flex:1;height:1px;background:var(--line)}
footer{text-align:center;font-family:var(--font-display);font-style:italic;color:var(--ink-muted);font-size:.85rem;padding:1.2rem 0 2.5rem}

.ov{display:none;position:fixed;inset:0;background:rgba(42,37,32,.45);backdrop-filter:blur(3px);z-index:200}
.ov.open{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1.3rem 1.2rem 2rem;max-width:560px;margin:0 auto;box-shadow:0 -8px 32px rgba(42,37,32,.18);transform:translateY(105%);transition:transform .3s var(--ease-out);max-height:92dvh;overflow-y:auto;z-index:201}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto .9rem}
.sheet-title{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin-bottom:1rem}
.sheet-title em{font-style:italic;color:var(--c-accent)}
.fg{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.85rem}
.fg label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.fg input{border:1.5px solid var(--line);border-radius:var(--radius-md);background:var(--card);font-family:var(--font-ui);font-size:.95rem;color:var(--ink);padding:.55rem .7rem;outline:none;transition:border-color var(--t-fast);width:100%}
.fg input:focus{border-color:var(--c-accent)}
.subl{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem}
.chip{padding:.34rem .7rem;border-radius:var(--radius-pill);border:1.5px solid var(--line);background:var(--card);font-size:.8rem;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all var(--t-fast)}
.chip:hover{border-color:var(--c-accent);color:var(--c-accent)}
.chip.sel{background:var(--c-accent);color:#fff;border-color:transparent}
.icon-chip{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;padding:0;border-radius:var(--radius-md)}
.day-chip{width:38px;padding:.34rem 0;text-align:center}
.sheet-actions{display:flex;gap:.6rem;margin-top:.5rem;justify-content:space-between;align-items:center}
.sheet-actions .right{display:flex;gap:.6rem}
.btn-cancel{padding:.55rem 1rem;border-radius:var(--radius-md);border:1.5px solid var(--line);background:none;font-family:var(--font-ui);font-size:.84rem;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all var(--t-fast)}
.btn-cancel:hover{border-color:var(--ink-muted);color:var(--ink)}
.btn-save{padding:.55rem 1.4rem;border-radius:var(--radius-md);border:none;background:var(--c-accent);color:#fff;font-family:var(--font-ui);font-size:.84rem;font-weight:600;cursor:pointer;transition:background var(--t-fast)}
.btn-save:hover{background:var(--c-accent-dark)}
.btn-del{padding:.55rem .9rem;border-radius:var(--radius-md);border:1.5px solid rgba(200,60,60,.4);background:none;color:#c44;font-family:var(--font-ui);font-size:.84rem;font-weight:600;cursor:pointer;transition:all var(--t-fast)}
.btn-del:hover{background:rgba(200,60,60,.08)}
.hint{font-size:.68rem;color:var(--ink-muted);line-height:1.45;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius-md);padding:.6rem .75rem;margin-bottom:1rem}
.hint b{color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-link" href="personal.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Personal
    </a>
    <div class="hrow">
      <button class="notif-btn" id="notifBtn">🔔 Notificaciones</button>
      <div class="sync-row" id="syncRow" hidden><span class="sync-dot" id="syncDot"></span><span id="syncLbl">Local</span></div>
    </div>
    <div class="kicker">Personal · Rutina</div>
    <h1><em>Hábitos</em></h1>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="setTab('hoy',this)">Hoy</button>
    <button class="tab-btn" onclick="setTab('resumen',this)">Resumen</button>
  </div>

  <!-- ── HOY ── -->
  <div id="hoyView">
    <div class="today-card">
      <div class="ring">
        <svg width="62" height="62" viewBox="0 0 62 62">
          <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>
          <circle id="ringArc" cx="31" cy="31" r="26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
                  stroke-dasharray="163.4" stroke-dashoffset="163.4" style="transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)"/>
        </svg>
        <div class="rtxt" id="ringTxt">0%</div>
      </div>
      <div class="tinfo">
        <div class="tlbl" id="todayLbl">Hoy</div>
        <div class="tval" id="todayVal">0 de 0</div>
        <div class="tsub" id="todaySub">Sin hábitos para hoy</div>
      </div>
    </div>

    <button class="add-trip-btn" onclick="openSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo hábito
    </button>

    <p class="section-label">Hoy</p>
    <div id="habList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <p>Nada programado para hoy.<br>Toca <strong>Nuevo hábito</strong>.</p>
    </div>
  </div>

  <!-- ── RESUMEN ── -->
  <div id="resumenView" style="display:none"></div>

  <footer>Lo que se repite, se vuelve quien eres.</footer>
</div>

<!-- Sheet add/edit -->
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">Nuevo <em>hábito</em></div>

  <div class="fg"><label>Nombre</label><input type="text" id="nameInput" placeholder="Dormir, Comer, Tomar agua…" autocomplete="off"></div>

  <div class="subl">Icono</div>
  <div class="chips" id="iconChips"></div>

  <div class="fg"><label>Hora del recordatorio</label><input type="time" id="timeInput"></div>

  <div class="subl">Días</div>
  <div class="chips" id="dayChips"></div>
  <div class="chips" style="margin-top:-.5rem">
    <button class="chip" onclick="setDays('todos')">Todos</button>
    <button class="chip" onclick="setDays('semana')">Lun–Vie</button>
    <button class="chip" onclick="setDays('finde')">Fin de semana</button>
  </div>

  <div class="sheet-actions">
    <button class="btn-del" id="delBtn" style="visibility:hidden" onclick="deleteCurrent()">Eliminar</button>
    <div class="right">
      <button class="btn-cancel" onclick="closeSheet()">Cancelar</button>
      <button class="btn-save" onclick="saveHabit()">Guardar</button>
    </div>
  </div>
</div>

<script>
const ICONS=['🛏️','🍽️','💧','💊','🏃','🦷','📖','🧘','☀️','🌙','💪','🚿','📱','🧴','☕','🥗','✍️','🎧'];
const DAYS=['D','L','M','X','J','V','S'];
const DAYNAMES=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

// ── Estado (offline-first + Firebase) ────────────────────────────────────────
let habits = JSON.parse(localStorage.getItem('habitos_list')||'null');
let done   = JSON.parse(localStorage.getItem('habitos_done')||'{}');   // {"YYYY-MM-DD":[id,...]}
let stateTs= parseInt(localStorage.getItem('habitos_ts')||'0',10);
if(!Array.isArray(habits)) habits=[
  {id:1,name:'Dormir',      icon:'🛏️',time:'22:30',days:[0,1,2,3,4,5,6]},
  {id:2,name:'Desayunar',   icon:'🍽️',time:'08:00',days:[0,1,2,3,4,5,6]},
  {id:3,name:'Comer',       icon:'🥗',time:'14:30',days:[0,1,2,3,4,5,6]},
  {id:4,name:'Cenar',       icon:'🍽️',time:'20:00',days:[0,1,2,3,4,5,6]},
  {id:5,name:'Tomar agua',  icon:'💧',time:'11:00',days:[0,1,2,3,4,5,6]},
];

const FB={apiKey:"AIzaSyAf1fCH3Fuk0Y0UcrLXjJWCmldu3Aktrmo",databaseURL:"https://mi-horario-3746e-default-rtdb.firebaseio.com"};
let fireDb=null,_lastTs=stateTs,_applyingRemote=false;
(function initFirebase(){
  if(typeof firebase==='undefined')return;
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB);
    fireDb=firebase.database();
    const row=document.getElementById('syncRow'),dot=document.getElementById('syncDot'),lbl=document.getElementById('syncLbl');
    if(row)row.hidden=false;
    fireDb.ref('.info/connected').on('value',s=>{if(!dot)return;if(s.val()){dot.classList.add('on');lbl.textContent='Sincronizado';}else{dot.classList.remove('on');lbl.textContent='Sin conexión';}});
    fireDb.ref('habitos/state').once('value',s=>{const v=s.val();if(v&&v._ts&&v._ts>stateTs)applyRemote(v);else if(!v||!v._ts)persist(true);});
    fireDb.ref('habitos/state').on('value',s=>{const v=s.val();if(!v||!v._ts)return;if(v._ts>_lastTs)applyRemote(v);});
  }catch(e){console.warn('Firebase init:',e);}
})();
function applyRemote(v){
  _applyingRemote=true;
  if(Array.isArray(v.habits))habits=v.habits;
  habits.forEach(h=>{if(!Array.isArray(h.days))h.days=[0,1,2,3,4,5,6];if(!h.icon)h.icon='✅';if(!h.time)h.time='09:00';});
  done=v.done||{};
  stateTs=v._ts;_lastTs=v._ts;persist(false);renderAll();scheduleNotifs();_applyingRemote=false;
}
function persist(push=true){
  localStorage.setItem('habitos_list',JSON.stringify(habits));
  localStorage.setItem('habitos_done',JSON.stringify(done));
  localStorage.setItem('habitos_ts',String(stateTs));
  if(push&&fireDb&&!_applyingRemote)fireDb.ref('habitos/state').set({habits,done,_ts:stateTs}).catch(()=>{});
}
function commit(){stateTs=Date.now();_lastTs=stateTs;persist(true);}

// ── Utilidades ────────────────────────────────────────────────────────────────
function dstr(d){const x=d||new Date();return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-');}
function todayStr(){return dstr(new Date());}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mins(t){const[h,m]=String(t||'0:0').split(':').map(Number);return h*60+(m||0);}
function fmtTime(t){
  const[h,m]=String(t||'0:0').split(':').map(Number);
  const ap=h<12?'am':'pm';const h12=h%12===0?12:h%12;
  return h12+':'+String(m||0).padStart(2,'0')+' '+ap;
}
function forDay(dow){return habits.filter(h=>(h.days||[]).includes(dow)).sort((a,b)=>mins(a.time)-mins(b.time));}
function doneSet(ds){return new Set(done[ds]||[]);}
function isDone(id,ds){return doneSet(ds).has(id);}
function toggleDone(id){
  const ds=todayStr();
  const s=doneSet(ds);
  if(s.has(id))s.delete(id);else s.add(id);
  done[ds]=[...s];
  if(!done[ds].length)delete done[ds];
  commit();renderAll();
}

// racha: días consecutivos (contando solo los días en que tocaba) cumplidos
function streakOf(h){
  let n=0;const d=new Date();d.setHours(0,0,0,0);
  // si hoy tocaba y aún no se marca, no rompe la racha: se empieza a contar desde ayer
  if((h.days||[]).includes(d.getDay())&&!isDone(h.id,dstr(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    if((h.days||[]).includes(d.getDay())){
      if(isDone(h.id,dstr(d)))n++;else break;
    }
    d.setDate(d.getDate()-1);
  }
  return n;
}

// ── Sheet ─────────────────────────────────────────────────────────────────────
let _editId=null,_selIcon='🛏️',_selDays=[0,1,2,3,4,5,6];
function openSheet(id=null){
  _editId=id;
  const h=id?habits.find(x=>x.id===id):null;
  document.getElementById('sheetTitle').innerHTML=id?'Editar <em>hábito</em>':'Nuevo <em>hábito</em>';
  document.getElementById('nameInput').value=h?h.name:'';
  document.getElementById('timeInput').value=h?h.time:'09:00';
  _selIcon=h?h.icon:'🛏️';
  _selDays=h?[...(h.days||[])]:[0,1,2,3,4,5,6];
  document.getElementById('delBtn').style.visibility=id?'visible':'hidden';
  renderIconChips();renderDayChips();
  document.getElementById('ov').classList.add('open');
  requestAnimationFrame(()=>document.getElementById('sheet').classList.add('open'));
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('ov').classList.remove('open');_editId=null;}
document.getElementById('ov').onclick=closeSheet;

function renderIconChips(){
  document.getElementById('iconChips').innerHTML=ICONS.map((ic,i)=>
    `<button class="chip icon-chip${ic===_selIcon?' sel':''}" onclick="pickIcon(${i})">${ic}</button>`).join('');
}
function pickIcon(i){_selIcon=ICONS[i];renderIconChips();}
function renderDayChips(){
  document.getElementById('dayChips').innerHTML=DAYS.map((d,i)=>
    `<button class="chip day-chip${_selDays.includes(i)?' sel':''}" onclick="toggleDay(${i})">${d}</button>`).join('');
}
function toggleDay(i){
  if(_selDays.includes(i))_selDays=_selDays.filter(x=>x!==i);else _selDays.push(i);
  renderDayChips();
}
function setDays(preset){
  _selDays = preset==='todos'?[0,1,2,3,4,5,6] : preset==='semana'?[1,2,3,4,5] : [0,6];
  renderDayChips();
}

function saveHabit(){
  const name=document.getElementById('nameInput').value.trim();
  const time=document.getElementById('timeInput').value||'09:00';
  if(!name){alert('Ponle nombre al hábito.');return;}
  if(!_selDays.length){alert('Elige al menos un día.');return;}
  if(_editId){
    const h=habits.find(x=>x.id===_editId);
    h.name=name;h.time=time;h.icon=_selIcon;h.days=[..._selDays];
  }else{
    habits.push({id:Date.now(),name,time,icon:_selIcon,days:[..._selDays]});
  }
  commit();renderAll();scheduleNotifs();closeSheet();
}
function deleteCurrent(){
  if(!_editId)return;
  if(!confirm('¿Eliminar este hábito?'))return;
  habits=habits.filter(x=>x.id!==_editId);
  Object.keys(done).forEach(d=>{done[d]=done[d].filter(x=>x!==_editId);if(!done[d].length)delete done[d];});
  commit();renderAll();scheduleNotifs();closeSheet();
}

// ── Render Hoy ────────────────────────────────────────────────────────────────
function renderToday(){
  const ds=todayStr(),dow=new Date().getDay();
  const list=forDay(dow),s=doneSet(ds);
  const hechos=list.filter(h=>s.has(h.id)).length;
  const pct=list.length?Math.round(hechos/list.length*100):0;
  const C=2*Math.PI*26;
  document.getElementById('ringArc').setAttribute('stroke-dashoffset',String(C*(1-pct/100)));
  document.getElementById('ringTxt').textContent=pct+'%';
  document.getElementById('todayLbl').textContent=DAYNAMES[dow];
  document.getElementById('todayVal').textContent=hechos+' de '+list.length;
  document.getElementById('todaySub').textContent =
    !list.length ? 'Sin hábitos para hoy'
    : hechos===list.length ? '¡Día completo! 🎉'
    : (list.length-hechos)+' pendiente'+(list.length-hechos!==1?'s':'');

  const el=document.getElementById('habList'),empty=document.getElementById('emptyState');
  if(!list.length){el.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  el.innerHTML=list.map(h=>{
    const hecho=s.has(h.id);
    const tarde=!hecho&&mins(h.time)<nowM;
    const st=streakOf(h);
    return `<div class="hab${hecho?' done':''}">
      <div class="hico">${h.icon||'✅'}</div>
      <div class="hinfo" onclick="openSheet(${h.id})">
        <div class="hname">${esc(h.name)}</div>
        <div class="hmeta"><b>${fmtTime(h.time)}</b>${tarde?' · <span class="late">pendiente</span>':''}</div>
      </div>
      ${st>1?`<div class="hstreak">🔥 ${st}</div>`:''}
      <button class="check${hecho?' on':''}" onclick="toggleDone(${h.id})" aria-label="Marcar ${esc(h.name)}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>`;
  }).join('');
}

// ── Render Resumen (últimos 7 días) ───────────────────────────────────────────
function renderResumen(){
  const wrap=document.getElementById('resumenView');
  if(!habits.length){wrap.innerHTML=`<div class="empty-state"><p>Sin hábitos todavía.</p></div>`;return;}
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d);}
  let totTocaba=0,totHechos=0;
  const rows=habits.map(h=>{
    let tocaba=0,hechos=0;
    const cells=days.map(d=>{
      if(!(h.days||[]).includes(d.getDay()))return '<i class="na"></i>';
      tocaba++;
      const ok=isDone(h.id,dstr(d));
      if(ok)hechos++;
      return ok?'<i class="on"></i>':'<i></i>';
    }).join('');
    totTocaba+=tocaba;totHechos+=hechos;
    const pct=tocaba?Math.round(hechos/tocaba*100):0;
    const st=streakOf(h);
    return {h,pct,tocaba,hechos,cells,st};
  }).sort((a,b)=>b.pct-a.pct);

  const gPct=totTocaba?Math.round(totHechos/totTocaba*100):0;
  wrap.innerHTML=`
    <div class="today-card">
      <div class="ring">
        <svg width="62" height="62" viewBox="0 0 62 62">
          <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>
          <circle cx="31" cy="31" r="26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
                  stroke-dasharray="163.4" stroke-dashoffset="${163.4*(1-gPct/100)}"/>
        </svg>
        <div class="rtxt">${gPct}%</div>
      </div>
      <div class="tinfo">
        <div class="tlbl">Últimos 7 días</div>
        <div class="tval">${totHechos} de ${totTocaba}</div>
        <div class="tsub">cumplimiento general</div>
      </div>
    </div>
    <p class="section-label">Por hábito</p>
    <div class="resumen-card">
      ${rows.map(r=>`
        <div class="st">
          <div class="sico">${r.h.icon||'✅'}</div>
          <div class="sbody">
            <div class="stop"><span class="sname">${esc(r.h.name)}</span><span class="spct">${r.pct}%</span></div>
            <div class="sbar"><i style="width:${r.pct}%"></i></div>
            <div class="dots">${r.cells}</div>
            <div class="smeta">${r.hechos}/${r.tocaba} días${r.st>0?' · 🔥 racha de '+r.st:''}</div>
          </div>
        </div>`).join('')}
    </div>
    <p class="section-label">Nota</p>
    <div class="hint">Los cuadritos con borde punteado son días en que ese hábito <b>no tocaba</b>. No cuentan en contra.</div>`;
}

// ── Notificaciones locales ────────────────────────────────────────────────────
let _timers=[],_lastDay=-1;
function showNotif(title,body,tag){
  if(navigator.serviceWorker&&navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type:'NOTIF',title,body,tag,icon:'./icon-192.png'});
  }else if('Notification' in window&&Notification.permission==='granted'){
    new Notification(title,{body,icon:'./icon-192.png',tag});
  }
}
function scheduleNotifs(){
  _timers.forEach(t=>clearTimeout(t));_timers=[];
  if(!('Notification' in window)||Notification.permission!=='granted'){updateNotifBtn();return;}
  const now=new Date(),ds=todayStr(),dow=now.getDay();
  forDay(dow).forEach(h=>{
    const[hh,mm]=String(h.time).split(':').map(Number);
    const t=new Date();t.setHours(hh,mm||0,0,0);
    const delay=t-now;
    if(delay<=0)return;                       // ya pasó la hora hoy
    _timers.push(setTimeout(()=>{
      if(!isDone(h.id,todayStr()))showNotif((h.icon||'⏰')+' '+h.name,'Es hora — marca tu palomita ✔','hab-'+h.id);
    },delay));
  });
  updateNotifBtn();
}
function updateNotifBtn(){
  const btn=document.getElementById('notifBtn');if(!btn)return;
  const p=('Notification' in window)?Notification.permission:'unsupported';
  if(p==='granted'){btn.classList.add('on');btn.textContent='🔔 '+_timers.length+' hoy';}
  else if(p==='denied'){btn.classList.remove('on');btn.textContent='🔕 Bloqueadas';}
  else{btn.classList.remove('on');btn.textContent='🔔 Notificaciones';}
}
document.getElementById('notifBtn').onclick=async()=>{
  if(!('Notification' in window)){alert('Tu navegador no soporta notificaciones.');return;}
  if(Notification.permission==='denied'){
    alert('Notificaciones bloqueadas.\nVe a Ajustes del sistema → Apps → Limitless → Notificaciones y actívalas.');return;
  }
  const r=await Notification.requestPermission();
  if(r==='granted'){
    showNotif('✅ Hábitos','Notificaciones activadas — te aviso a la hora de cada hábito','test');
    scheduleNotifs();
  }
  updateNotifBtn();
};

// Reprogramar al volver a la app + detectar cambio de día
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const n=new Date();
  if(n.getDay()!==_lastDay){_lastDay=n.getDay();}
  renderAll();scheduleNotifs();
});
setInterval(()=>{
  const n=new Date();
  if(n.getDay()!==_lastDay){_lastDay=n.getDay();renderAll();scheduleNotifs();}
},60000);

// ── Tabs ──────────────────────────────────────────────────────────────────────
let activeTab='hoy';
function setTab(t,el){
  activeTab=t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('hoyView').style.display=t==='hoy'?'block':'none';
  document.getElementById('resumenView').style.display=t==='resumen'?'block':'none';
  if(t==='resumen')renderResumen();
}

function renderAll(){renderToday();if(activeTab==='resumen')renderResumen();}
_lastDay=new Date().getDay();
renderAll();
if('Notification' in window&&Notification.permission==='granted')scheduleNotifs();else updateNotifBtn();
</script>
